name: MafLib Tests (No BLAS)
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test-no-blas:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # Linux setup (note: no libopenblas-dev, so OpenBLAS is NOT
            # detected and the portable non-BLAS code paths get tested)
            - name: Install dependencies (Linux)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang ninja-build cmake libomp-dev

            - name: Configure (clang-debug preset, no BLAS)
              env:
                  CC: clang
                  CXX: clang++
              run: |
                  cmake --preset clang-debug | tee configure.log
                  # Verify the build really is BLAS-free
                  if grep -q "OpenBLAS found" configure.log; then
                      echo "::error::OpenBLAS was found; expected a non-BLAS build."
                      exit 1
                  fi
                  grep -q "OpenBLAS NOT found" configure.log || {
                      echo "::error::'OpenBLAS NOT found' message missing; a BLAS backend may be active."
                      exit 1
                  }

            # ⚙️ Build
            - name: Build
              run: cmake --build --preset clang-debug --parallel

            # 🧪 Run tests
            - name: Run tests
              run: ctest --preset clang-debug --output-on-failure
